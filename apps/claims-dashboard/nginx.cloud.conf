server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 32k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /demo/token {
    limit_except POST { deny all; }
    proxy_set_header Origin "";
    proxy_pass http://keycloak:8080/realms/turaco-local/protocol/openid-connect/token;
  }
  location = /demo/health { proxy_pass http://insurance-api:8080/actuator/health; }
  location /api/ { proxy_pass http://insurance-api:8080; }
  location / { try_files $uri /index.html; }
}
