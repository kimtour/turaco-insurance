server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:8081; img-src 'self' data:; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://insurance-api:8080; }
  location / { try_files $uri /index.html; }
}
